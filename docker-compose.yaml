services:
  paperwing:
    build: .
    image: paperwing:local
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      PAPERWING_ADDRESS: "0.0.0.0:8080"
      PAPERWING_DATABASE_PATH: "/data/paperwing.db"
      PAPERWING_ATTACHMENT_PATH: "/data/attachments"
    volumes:
      - paperwing-data:/data
    healthcheck:
      test: ["CMD", "/paperwing", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  paperwing-data:
